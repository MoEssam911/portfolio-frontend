[build]
  command = "npm run generate"
  publish = ".output/public"
  # Pipeline deploys prebuilt assets from GitHub Actions. Skip Netlify's own
  # build even if the Git provider is still linked.
  ignore = "exit 1"

[build.environment]
  # Static SSG output (.output/public). Not the SSR `netlify` preset.
  NITRO_PRESET = "static"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
